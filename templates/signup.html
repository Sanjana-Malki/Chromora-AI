{% extends "base.html" %}
{% block title %}Sign Up - Chromora AI{% endblock %}
{% block content %}
<main class="container auth-container">
    <section class="card auth-card">
        <h1>Create Account</h1>
        <p class="subtitle">Join Chromora AI to colorize your images.</p>

        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('signup') }}" class="auth-form">
            <label for="full_name">Full Name
                <input type="text" id="full_name" name="full_name" value="{{ full_name or '' }}" required>
            </label>
            <label for="email">Email Address
                <input type="email" id="email" name="email" value="{{ email or '' }}" required>
            </label>
            <label for="password">Password
                <input type="password" id="password" name="password" required>
            </label>
            <label for="confirm_password">Confirm Password
                <input type="password" id="confirm_password" name="confirm_password" required>
            </label>
            <button type="submit" class="btn btn-primary btn-large">Create Account</button>
        </form>

        <p class="note auth-link">Already have an account? <a href="{{ url_for('signin') }}">Sign In</a></p>
    </section>
</main>
{% endblock %}
