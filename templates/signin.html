{% extends "base.html" %}
{% block title %}Sign In - Chromora AI{% endblock %}
{% block content %}
<main class="container auth-container">
    <section class="card auth-card">
        <h1>Sign In</h1>
        <p class="subtitle">Welcome back to Chromora AI.</p>

        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('signin') }}" class="auth-form">
            <input type="hidden" name="next_url" value="{{ next_url or '' }}">
            <label for="email">Email Address
                <input type="email" id="email" name="email" value="{{ email or '' }}" required>
            </label>
            <label for="password">Password
                <input type="password" id="password" name="password" required>
            </label>
            <button type="submit" class="btn btn-primary btn-large">Sign In</button>
        </form>

        <p class="note auth-link">Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a></p>
    </section>
</main>
{% endblock %}
